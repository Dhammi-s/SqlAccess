# Sample GitHub Actions workflow for the CI/CD portal (Option 3).
#
# HOW TO USE
# 1. Copy this file into your TARGET repo (e.g. Dhammi-s/WorkProvider360) at:
#        .github/workflows/deploy.yml
# 2. In that repo → Settings → Secrets and variables → Actions, add:
#        FTP_HOST      e.g. site80671.siteasp.net
#        FTP_USERNAME  e.g. site80671
#        FTP_PASSWORD  your FTP/SFTP password
# 3. In the SQL Access portal, set the website's "Workflow file" to: deploy.yml
# 4. Click Deploy — the portal dispatches this workflow, streams its steps,
#    and records history. GitHub's runner does the build + upload (no shared-host
#    limits, and GitHub's network is not firewall-blocked like your box was).
#
# The `workflow_dispatch` trigger is REQUIRED so the portal can start it via the API.

name: Deploy

# IMPORTANT: this file (with workflow_dispatch) must exist on EVERY branch you deploy,
# not just master — GitHub reads the trigger from the branch you dispatch.
on:
  workflow_dispatch:      # lets the portal trigger it
  push:
    branches: [ master, Development-secrateissue ]  # optional: also deploy on push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        # Point at your web project's .csproj (adjust the path if it isn't at the repo root).
        run: dotnet publish WorkProvider360.csproj -c Release -o publish

      # SFTP is reliable for MonsterASP.NET; FTPS (port 21) gives "550 driver error".
      - name: Deploy to MonsterASP.NET (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.FTP_HOST }}       # site80671.siteasp.net
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './publish/*'
          remote_path: '/wwwroot'
          sftp_only: true

# ── If you later hit "file in use / locked DLL" on updates (because the app is running),
#    the robust fix for ASP.NET on MonsterASP.NET is WebDeploy (the "WebDeploy access" tab
#    in your panel) — it takes the app offline, overwrites locked files, and brings it back.
#    Ask and I'll provide a WebDeploy-based workflow.
