# RECOMMENDED for a LIVE ASP.NET app on MonsterASP.NET — uses WebDeploy (MSDeploy).
#
# Why: FTP/SFTP can't overwrite a running app's DLLs (IIS locks them) and can't chmod
# on shared hosting. WebDeploy takes the app offline, overwrites, and restarts — clean every time.
#
# HOW TO USE
# 1. Copy this into your target repo at: .github/workflows/deploy.yml
#    (must be on EVERY branch you deploy — GitHub reads workflow_dispatch from that branch)
# 2. Open your MonsterASP.NET panel → the "WebDeploy access" tab. It shows:
#       Server / URL   (an https://…:8172/msdeploy.axd?site=… endpoint)
#       Site name      (e.g. site80671)
#       Username       (e.g. site80671)
#       Password
# 3. In the repo → Settings → Secrets and variables → Actions, add:
#       WEBDEPLOY_URL       the msdeploy endpoint URL from the panel
#       WEBDEPLOY_SITE      the site name
#       WEBDEPLOY_USERNAME  the username
#       WEBDEPLOY_PASSWORD  the password
# 4. In the portal, set the website's "Workflow file" = deploy.yml, then Deploy.

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [ master, Development-secrateissue ]

jobs:
  deploy:
    runs-on: windows-latest        # msdeploy.exe ships on the Windows runner image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish WorkProvider360.csproj -c Release -o publish

      # Run via cmd (not PowerShell): msdeploy's comma-separated -dest args don't survive
      # PowerShell quoting. cmd expands %VARS% cleanly. AppOffline releases locked DLLs.
      - name: Deploy with WebDeploy
        shell: cmd
        env:
          WD_SITE: ${{ secrets.WEBDEPLOY_SITE }}
          WD_URL: ${{ secrets.WEBDEPLOY_URL }}
          WD_USER: ${{ secrets.WEBDEPLOY_USERNAME }}
          WD_PASS: ${{ secrets.WEBDEPLOY_PASSWORD }}
        run: >
          "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          -verb:sync
          -source:contentPath="%GITHUB_WORKSPACE%\publish"
          -dest:contentPath="%WD_SITE%",computerName="%WD_URL%",userName="%WD_USER%",password="%WD_PASS%",authtype="Basic"
          -allowUntrusted=true
          -enableRule:AppOffline
